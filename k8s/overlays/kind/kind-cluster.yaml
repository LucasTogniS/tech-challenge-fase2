# Cluster local (kind) para validar os manifestos antes de gastar crédito na AWS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: togglemaster-fase2
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress acessível em http://localhost:8080 (evita conflito com a porta 80)
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker

# Processo administrativo (12-Factor, fator XII): o schema é aplicado por um Job
# separado, e não no boot do processo web. Os scripts são idempotentes.
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migration
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: togglemaster
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service-migration
        app.kubernetes.io/part-of: togglemaster
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v service_key="$SERVICE_API_KEY" -f /schema/init.sql
          envFrom:
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: auth-service-schema
